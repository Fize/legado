name: Android quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JVM tests
            task: testAppDebugUnitTest
          - name: Android lint
            task: lintAppDebug
          - name: Release and R8
            task: assembleAppRelease
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Run check
        run: ./gradlew ${{ matrix.task }} --stacktrace
      - name: Test APK artifact checks
        if: matrix.task == 'assembleAppRelease'
        run: python3 -B -m unittest discover -s tools -p 'test_android_*.py'
      - name: Check native ABI and page alignment
        if: matrix.task == 'assembleAppRelease'
        run: python3 tools/check_android_native_pages.py app/build/outputs/apk/app/release/*.apk --json app/build/reports/native-pages.json --require-abis arm64-v8a armeabi-v7a x86_64
      - name: Check release Proto field contract
        if: matrix.task == 'assembleAppRelease'
        run: python3 tools/check_android_proto_fields.py --mapping app/build/outputs/mapping/appRelease/mapping.txt app/build/outputs/apk/app/release/*.apk --json app/build/reports/proto-fields.json
      - name: Record source and artifact identities
        if: always()
        run: python3 tools/capture_android_compatibility.py --output app/build/reports/compatibility-source.json
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-quality-${{ matrix.task }}
          if-no-files-found: warn
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/
            modules/*/build/reports/
            modules/*/build/test-results/

  device-compatibility:
    name: Device API ${{ matrix.api }} (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34, 36]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build device APKs
        run: >-
          ./gradlew assembleAppDebug assembleAppDebugAndroidTest --stacktrace
          --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx4g -Xms256m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check normal and large-font windows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: legado-ci-api${{ matrix.api }}
          ram-size: 2048M
          disable-animations: true
          enable-hw-keyboard: false
          script: >-
            python3 -B tools/check_android_device_ci.py
            --adb "$ANDROID_HOME/platform-tools/adb" --serial "emulator-$EMULATOR_PORT"
            --expected-api ${{ matrix.api }} --expected-abi x86_64
            --app-apk app/build/outputs/apk/app/debug/app-app-x86_64-debug.apk
            --test-apk app/build/outputs/apk/androidTest/app/debug/app-app-debug-androidTest.apk
            --output app/build/reports/device-ci-api${{ matrix.api }}
            && python3 -B tools/check_android_public_download.py
            --adb "$ANDROID_HOME/platform-tools/adb" --serial "emulator-$EMULATOR_PORT"
            --expected-api ${{ matrix.api }} --expected-abi x86_64
            --app-apk app/build/outputs/apk/app/debug/app-app-x86_64-debug.apk
            --test-apk app/build/outputs/apk/androidTest/app/debug/app-app-debug-androidTest.apk
            --output app/build/reports/public-download-api${{ matrix.api }}
            && python3 -B tools/check_android_book_download.py
            --adb "$ANDROID_HOME/platform-tools/adb" --serial "emulator-$EMULATOR_PORT"
            --expected-api ${{ matrix.api }} --expected-abi x86_64
            --app-apk app/build/outputs/apk/app/debug/app-app-x86_64-debug.apk
            --test-apk app/build/outputs/apk/androidTest/app/debug/app-app-debug-androidTest.apk
            --output app/build/reports/book-download-api${{ matrix.api }}
            && python3 -B tools/check_android_export_restore.py
            --adb "$ANDROID_HOME/platform-tools/adb" --serial "emulator-$EMULATOR_PORT"
            --expected-api ${{ matrix.api }} --expected-abi x86_64
            --app-apk app/build/outputs/apk/app/debug/app-app-x86_64-debug.apk
            --test-apk app/build/outputs/apk/androidTest/app/debug/app-app-debug-androidTest.apk
            --output app/build/reports/export-restore-api${{ matrix.api }}
            && python3 -B tools/check_android_saf_export_death.py
            --adb "$ANDROID_HOME/platform-tools/adb" --serial "emulator-$EMULATOR_PORT"
            --expected-avd legado-ci-api${{ matrix.api }}
            --expected-api ${{ matrix.api }} --expected-abi x86_64
            --app-apk app/build/outputs/apk/app/debug/app-app-x86_64-debug.apk
            --test-apk app/build/outputs/apk/androidTest/app/debug/app-app-debug-androidTest.apk
            --output app/build/reports/saf-export-death-api${{ matrix.api }}
            && ( [ ${{ matrix.api }} -lt 33 ] || python3 -B tools/check_android_saf_export_death.py
            --adb "$ANDROID_HOME/platform-tools/adb" --serial "emulator-$EMULATOR_PORT"
            --expected-avd legado-ci-api${{ matrix.api }}
            --expected-api ${{ matrix.api }} --expected-abi x86_64 --termination user-stop
            --app-apk app/build/outputs/apk/app/debug/app-app-x86_64-debug.apk
            --test-apk app/build/outputs/apk/androidTest/app/debug/app-app-debug-androidTest.apk
            --output app/build/reports/saf-export-user-stop-api${{ matrix.api }} )
            && ( [ ${{ matrix.api }} -lt 35 ] || python3 -B tools/check_android_export_timeout.py
            --adb "$ANDROID_HOME/platform-tools/adb" --serial "emulator-$EMULATOR_PORT"
            --expected-avd legado-ci-api${{ matrix.api }}
            --expected-api ${{ matrix.api }} --expected-abi x86_64
            --app-apk app/build/outputs/apk/app/debug/app-app-x86_64-debug.apk
            --test-apk app/build/outputs/apk/androidTest/app/debug/app-app-debug-androidTest.apk
            --output app/build/reports/export-timeout-api${{ matrix.api }} )
            && ( [ ${{ matrix.api }} -lt 34 ] || python3 -B tools/check_android_modern_download.py
            --adb "$ANDROID_HOME/platform-tools/adb" --serial "emulator-$EMULATOR_PORT"
            --expected-avd legado-ci-api${{ matrix.api }}
            --expected-api ${{ matrix.api }} --expected-abi x86_64
            --app-apk app/build/outputs/apk/app/debug/app-app-x86_64-debug.apk
            --test-apk app/build/outputs/apk/androidTest/app/debug/app-app-debug-androidTest.apk
            --output app/build/reports/modern-download-api${{ matrix.api }} )
            && ( [ ${{ matrix.api }} -lt 34 ] || python3 -B tools/check_android_download_user_stop.py
            --adb "$ANDROID_HOME/platform-tools/adb" --serial "emulator-$EMULATOR_PORT"
            --expected-avd legado-ci-api${{ matrix.api }}
            --expected-api ${{ matrix.api }} --expected-abi x86_64
            --app-apk app/build/outputs/apk/app/debug/app-app-x86_64-debug.apk
            --test-apk app/build/outputs/apk/androidTest/app/debug/app-app-debug-androidTest.apk
            --output app/build/reports/download-user-stop-api${{ matrix.api }} )
            && ( [ ${{ matrix.api }} -lt 34 ] || python3 -B tools/check_android_download_process_death.py
            --adb "$ANDROID_HOME/platform-tools/adb" --serial "emulator-$EMULATOR_PORT"
            --expected-avd legado-ci-api${{ matrix.api }}
            --expected-api ${{ matrix.api }} --expected-abi x86_64 --notifications granted
            --app-apk app/build/outputs/apk/app/debug/app-app-x86_64-debug.apk
            --test-apk app/build/outputs/apk/androidTest/app/debug/app-app-debug-androidTest.apk
            --output app/build/reports/download-process-death-api${{ matrix.api }} )
            && ( [ ${{ matrix.api }} -lt 34 ] || python3 -B tools/check_android_download_reboot.py
            --adb "$ANDROID_HOME/platform-tools/adb" --serial "emulator-$EMULATOR_PORT"
            --expected-avd legado-ci-api${{ matrix.api }}
            --expected-api ${{ matrix.api }} --expected-abi x86_64 --notifications granted
            --app-apk app/build/outputs/apk/app/debug/app-app-x86_64-debug.apk
            --test-apk app/build/outputs/apk/androidTest/app/debug/app-app-debug-androidTest.apk
            --output app/build/reports/download-reboot-api${{ matrix.api }} )
      - name: Record source and artifact identities
        if: always()
        run: python3 tools/capture_android_compatibility.py --output app/build/reports/device-ci-source.json
      - name: Upload device diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-api${{ matrix.api }}-x86_64
          if-no-files-found: warn
          path: |
            app/build/reports/
            app/build/outputs/apk/app/debug/app-app-x86_64-debug.apk
            app/build/outputs/apk/androidTest/app/debug/app-app-debug-androidTest.apk
